version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The golang base image sets the shipped Go version; `task vulncheck` reads it.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
