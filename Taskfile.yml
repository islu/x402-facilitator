version: "3"

vars:
  BINARY: bin/facilitator
  PKG: ./cmd/facilitator

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  # ── Run ────────────────────────────────────────────────────────────────────
  run:
    desc: Run the facilitator (reads .env)
    cmds:
      - go run {{.PKG}}

  build:
    desc: Build the facilitator binary
    cmds:
      - go build -o {{.BINARY}} {{.PKG}}

  # ── Test ───────────────────────────────────────────────────────────────────
  test:
    desc: Run tests
    cmds:
      - go test ./...

  test:race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  test:cover:
    desc: Run tests with a coverage summary
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  # ── Quality ────────────────────────────────────────────────────────────────
  fmt:
    desc: Format the code
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Lint the Go codebase
    cmds:
      - golangci-lint run ./...

  vulncheck:
    desc: Scan for known vulnerabilities against the Go version the image ships with
    vars:
      # devbox's Go can trail the Dockerfile's golang image by a patch release;
      # scan the stdlib that is actually built into the image, not the local one.
      TOOLCHAIN:
        sh: sed -n 's/^FROM golang:\([0-9.]*\)-.*/go\1/p' Dockerfile
    env:
      GOTOOLCHAIN: "{{.TOOLCHAIN}}"
    cmds:
      - govulncheck ./...

  check:
    desc: Format, vet, lint and test
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: test

  # ── Codegen ────────────────────────────────────────────────────────────────
  wire:
    desc: Generate Wire dependency injection code
    cmds:
      - go tool wire gen {{.PKG}}/

  mockgen:
    desc: Generate mocks for the domain ports
    cmds:
      - go generate ./internal/domain/...

  generate:
    desc: Run wire + mockgen code generation
    deps: [wire, mockgen]

  # ── Docker ─────────────────────────────────────────────────────────────────
  docker:build:
    desc: Build the container image
    cmds:
      - docker build -t x402-facilitator:latest .

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf bin coverage.out
